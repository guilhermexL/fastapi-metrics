global:
  scrape_interval: 5s      # intervalo curto para demo; em produção use 15s-30s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fastapi-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]   # nome do serviço na rede do compose

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
